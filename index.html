<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a1f" />
    <title>3DGAME — Movement Prototype</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b2a1f'/%3E%3Cpath d='M16 5 6 24h20z' fill='%2378c46a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="3D game view"></canvas>

    <div id="hud" aria-live="polite">
      <div id="title">3DGAME <span>movement prototype</span></div>
      <div id="fps" title="Frames per second">-- FPS</div>
      <div id="help">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> move
        <span class="sep">·</span> <kbd>Shift</kbd> walk <span class="sep">·</span> wheel zoom
        <span class="sep">·</span> <kbd>E</kbd> pick up <span class="sep">·</span> <kbd>I</kbd> inventory <span class="sep">·</span> <kbd>Esc</kbd> close
      </div>
      <button id="restart" type="button" hidden>Restart</button>
    </div>

    <div id="game-ui"></div>

    <div id="loading" role="status">
      <div class="panel">
        <div id="loading-text">Starting…</div>
        <div class="bar"><div id="loading-bar"></div></div>
      </div>
    </div>

    <div id="error" role="alert" hidden>
      <div class="panel">
        <h2>Something went wrong</h2>
        <p id="error-message"></p>
        <pre id="error-detail"></pre>
        <div class="actions">
          <button id="error-retry" type="button">Try again</button>
          <button id="error-dismiss" type="button" class="secondary">Dismiss</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
